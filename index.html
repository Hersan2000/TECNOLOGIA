<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnologia</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #50296a;
            --btn-color: #10a26a;
            --btn-hover: #7ba702;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.05); /* Ligero contraste según el fondo */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        a {
            display: block;
            padding: 15px 20px;
            background-color: var(--btn-color);
            color: #ffffff; /* Texto de los botones siempre blanco para leer bien */
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        a:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tecnologia</h1>
    <p class="description">Aplicaciones de teoría</p>
        
        <ul>
        <li><a href="AppC114ESO.html">Criterio 1.1 4º de ESO</a></li>
        </ul>
    </div>

</body>
</html>
